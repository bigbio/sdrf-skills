name: Tools Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/**'
      - 'mcp/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'environment.yml'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'mcp/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'environment.yml'
      - 'pyproject.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[mcp]" pytest

      - name: Run tests
        run: |
          # the parse_sdrf round-trip downloads ontology files; keep CI offline
          python -m pytest tests/ -v --tb=short -k 'not roundtrip_validates_with_parse_sdrf'

      - name: Verify CLI help (all subcommands)
        run: |
          sdrf-tools --help
          python -m tools check --help
          python -m tools contract --help
          python -m tools build --help
          python -m tools search-params --help
          python -m tools score --help
          python -m tools fix --help
          python -m tools benchmark --help
          python -m tools massive-files --help
          python -m tools verify --help
          python -m tools cellline --help
          python -m tools bruker-dia --help

      - name: Run offline hallucination check on synthetic example
        run: |
          python -m tools check examples/PXD_synthetic.sdrf.tsv --offline || true

      - name: Score synthetic example
        run: |
          python -m tools score examples/PXD_synthetic.sdrf.tsv
